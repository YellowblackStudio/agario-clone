<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
	<title>Canvas agar.io Clone</title>
	<style type="text/css">
		body { margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
		#screen { display: none; width: 100%; height: 100%; background-color: #f2fbff; }
		#menu {
			position: absolute;
			width: 100%;
			height: 100%;
			background-color: #a0e0ff;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
		}
		#menu h1 { margin-bottom: 50px; font-size: 48px; }
		#menu button {
			padding: 15px 30px;
			font-size: 24px;
			cursor: pointer;
		}
	</style>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.1.4/jquery.min.js"></script>
</head>
<body>

	<!-- Menu inicial -->
	<div id="menu">
		<h1>Agar.io Clone</h1>
		<button id="startButton">Jogar</button>
	</div>

	<!-- Canvas do jogo -->
	<canvas id="screen"></canvas>

	<script type="text/javascript">
		const menu = document.getElementById('menu');
		const startButton = document.getElementById('startButton');
		const canvas = document.getElementById('screen');

		// Quando clicar em jogar
		startButton.addEventListener('click', () => {
			menu.style.display = 'none';       // Esconde menu
			canvas.style.display = 'block';    // Mostra canvas

			canvas.width = window.innerWidth;
			canvas.height = window.innerHeight;

			// Aqui chamamos o seu game.js
			if (typeof initGame === 'function') {
				initGame(); // seu game.js deve ter essa função
			}
		});
	</script>

	<!-- Seu jogo continua sendo carregado normalmente -->
	<script type="text/javascript" src="game.js"></script>

</body>
</html>
